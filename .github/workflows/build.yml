name: Build Qt (official-equivalent)

# Builds Qt 5.15.x from source with the SAME module/driver set as the official
# open-source installer, into the official directory layout:
#   Qt<ver>/<ver>/clang_64       (macOS, Universal x86_64+arm64)
#   Qt<ver>/<ver>/ios            (iOS, static)
#   Qt<ver>/<ver>/gcc_64         (Linux)
#   Qt<ver>/<ver>/android        (Android)
#   Qt<ver>/<ver>/msvc2019_64    (Windows, MSVC)
#
# NOTE: Qt only publishes open-source BINARIES up to 5.15.2; 5.15.3+ are source-only
# for open source. So the goal here is "same configure -> same library set as the
# official installer", verified on macOS against scripts/official_clang64.manifest.
# The one intentional difference: macOS is Universal (official was x86_64-only).

on:
  workflow_dispatch:
    inputs:
      qt_ver:
        description: "Qt Version"
        required: true
        default: "5.15.19"
        type: string
      platforms:
        description: "Comma-separated platforms to build (macos-universal,ios,linux,android,windows)"
        required: true
        default: "macos-universal,ios"
        type: string
      prerelease:
        description: "Release as Prerelease"
        required: true
        default: true
        type: boolean

env:
  QT_VER: ${{ inputs.qt_ver }}

jobs:
  #############################################################################
  # macOS — Universal (x86_64 + arm64), the verified reference build
  #############################################################################
  macos-universal:
    if: contains(inputs.platforms, 'macos-universal')
    runs-on: macos-14
    env:
      SPEC: clang_64
      DEPS_PREFIX: ${{ github.workspace }}/deps-universal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: "15.0.1" }
      - run: brew install perl pkg-config freetype harfbuzz libiodbc

      - name: Build universal dependencies (OpenSSL + libpq for the psql driver)
        run: |
          chmod +x scripts/build_deps.sh
          ./scripts/build_deps.sh "$DEPS_PREFIX"

      - name: Download & extract Qt ${{ env.QT_VER }} source
        run: |
          curl -L -o qt.tar.xz "https://download.qt.io/archive/qt/5.15/${QT_VER}/single/qt-everywhere-opensource-src-${QT_VER}.tar.xz"
          mkdir -p ${{ runner.temp }}/qt-src
          tar -xJf qt.tar.xz -C ${{ runner.temp }}/qt-src --strip-components=1

      - name: Configure / build / install
        run: |
          PREFIX="${{ runner.temp }}/Qt${QT_VER}/${QT_VER}/${SPEC}"
          chmod +x scripts/qt_configure.sh
          ./scripts/qt_configure.sh macos-universal "${{ runner.temp }}/qt-src" "$PREFIX" "$DEPS_PREFIX"
          cd "${{ runner.temp }}/qt-src/build-macos-universal"
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Rewrite leaked dep paths to @loader_path
        run: |
          PREFIX="${{ runner.temp }}/Qt${QT_VER}/${QT_VER}/${SPEC}"
          python3 find_lib_dep.py "$PREFIX" --deps-lib "$DEPS_PREFIX/lib"

      - name: Verify library set matches the official installer
        run: |
          PREFIX="${{ runner.temp }}/Qt${QT_VER}/${QT_VER}/${SPEC}"
          chmod +x scripts/verify_layout.sh
          ./scripts/verify_layout.sh "$PREFIX"

      - name: Archive & upload
        run: |
          cd ${{ runner.temp }}
          tar -czf qt-${QT_VER}-macos-universal.tar.gz Qt${QT_VER}
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: "qt-${{ inputs.qt_ver }}"
          release_name: "Qt ${{ inputs.qt_ver }}"
          file: ${{ runner.temp }}/qt-${{ inputs.qt_ver }}-macos-universal.tar.gz
          asset_name: qt-${{ inputs.qt_ver }}-macos-universal.tar.gz
          overwrite: true
          prerelease: ${{ inputs.prerelease }}

  #############################################################################
  # iOS — static, sqlite-only (matches the official ios/ layout)
  #############################################################################
  ios:
    if: contains(inputs.platforms, 'ios')
    runs-on: macos-14
    env:
      SPEC: ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: "15.0.1" }
      - run: brew install perl
      - name: Download & extract Qt ${{ env.QT_VER }} source
        run: |
          curl -L -o qt.tar.xz "https://download.qt.io/archive/qt/5.15/${QT_VER}/single/qt-everywhere-opensource-src-${QT_VER}.tar.xz"
          mkdir -p ${{ runner.temp }}/qt-src
          tar -xJf qt.tar.xz -C ${{ runner.temp }}/qt-src --strip-components=1
      - name: Configure / build / install
        run: |
          PREFIX="${{ runner.temp }}/Qt${QT_VER}/${QT_VER}/${SPEC}"
          chmod +x scripts/qt_configure.sh
          ./scripts/qt_configure.sh ios "${{ runner.temp }}/qt-src" "$PREFIX"
          cd "${{ runner.temp }}/qt-src/build-ios"
          make -j$(sysctl -n hw.ncpu)
          make install
      - name: Archive & upload
        run: |
          cd ${{ runner.temp }}
          tar -czf qt-${QT_VER}-ios.tar.gz Qt${QT_VER}
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: "qt-${{ inputs.qt_ver }}"
          release_name: "Qt ${{ inputs.qt_ver }}"
          file: ${{ runner.temp }}/qt-${{ inputs.qt_ver }}-ios.tar.gz
          asset_name: qt-${{ inputs.qt_ver }}-ios.tar.gz
          overwrite: true
          prerelease: ${{ inputs.prerelease }}

  #############################################################################
  # Linux — gcc_64 (OpenSSL runtime-loaded + full SQL set)
  # Not validated against a golden manifest; tune deps as needed.
  #############################################################################
  linux:
    if: contains(inputs.platforms, 'linux')
    runs-on: ubuntu-22.04
    env:
      SPEC: gcc_64
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libglu1-mesa-dev \
            '^libxcb.*-dev' libx11-xcb-dev libxrender-dev libxi-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev \
            libpq-dev unixodbc-dev libssl-dev python3
      - name: Download & extract Qt ${{ env.QT_VER }} source
        run: |
          curl -L -o qt.tar.xz "https://download.qt.io/archive/qt/5.15/${QT_VER}/single/qt-everywhere-opensource-src-${QT_VER}.tar.xz"
          mkdir -p ${{ runner.temp }}/qt-src
          tar -xJf qt.tar.xz -C ${{ runner.temp }}/qt-src --strip-components=1
      - name: Configure / build / install
        run: |
          PREFIX="${{ runner.temp }}/Qt${QT_VER}/${QT_VER}/${SPEC}"
          chmod +x scripts/qt_configure.sh
          ./scripts/qt_configure.sh linux "${{ runner.temp }}/qt-src" "$PREFIX"
          cd "${{ runner.temp }}/qt-src/build-linux"
          make -j$(nproc)
          make install
      - name: Archive & upload
        run: |
          cd ${{ runner.temp }}
          tar -czf qt-${QT_VER}-linux-gcc_64.tar.gz Qt${QT_VER}
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: "qt-${{ inputs.qt_ver }}"
          release_name: "Qt ${{ inputs.qt_ver }}"
          file: ${{ runner.temp }}/qt-${{ inputs.qt_ver }}-linux-gcc_64.tar.gz
          asset_name: qt-${{ inputs.qt_ver }}-linux-gcc_64.tar.gz
          overwrite: true
          prerelease: ${{ inputs.prerelease }}

  #############################################################################
  # Android — multi-ABI, sqlite-only. Needs NDK r21 for Qt 5.15.
  # Not validated against a golden manifest; tune NDK/SDK versions as needed.
  #############################################################################
  android:
    if: contains(inputs.platforms, 'android')
    runs-on: ubuntu-22.04
    env:
      SPEC: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "11" }
      - name: Set up NDK r21e (required by Qt 5.15)
        run: |
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q ndk.zip -d $HOME
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r21e" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
      - run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - name: Download & extract Qt ${{ env.QT_VER }} source
        run: |
          curl -L -o qt.tar.xz "https://download.qt.io/archive/qt/5.15/${QT_VER}/single/qt-everywhere-opensource-src-${QT_VER}.tar.xz"
          mkdir -p ${{ runner.temp }}/qt-src
          tar -xJf qt.tar.xz -C ${{ runner.temp }}/qt-src --strip-components=1
      - name: Configure / build / install
        run: |
          PREFIX="${{ runner.temp }}/Qt${QT_VER}/${QT_VER}/${SPEC}"
          chmod +x scripts/qt_configure.sh
          ./scripts/qt_configure.sh android "${{ runner.temp }}/qt-src" "$PREFIX"
          cd "${{ runner.temp }}/qt-src/build-android"
          make -j$(nproc)
          make install
      - name: Archive & upload
        run: |
          cd ${{ runner.temp }}
          tar -czf qt-${QT_VER}-android.tar.gz Qt${QT_VER}
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: "qt-${{ inputs.qt_ver }}"
          release_name: "Qt ${{ inputs.qt_ver }}"
          file: ${{ runner.temp }}/qt-${{ inputs.qt_ver }}-android.tar.gz
          asset_name: qt-${{ inputs.qt_ver }}-android.tar.gz
          overwrite: true
          prerelease: ${{ inputs.prerelease }}

  #############################################################################
  # Windows — MSVC (msvc2019_64). Heavy; tune toolchain/deps as needed.
  #############################################################################
  windows:
    if: contains(inputs.platforms, 'windows')
    runs-on: windows-2022
    env:
      SPEC: msvc2019_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Install Perl (Strawberry)
        run: choco install -y strawberryperl
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Download & extract Qt source
        shell: pwsh
        run: |
          curl -L -o qt.tar.xz "https://download.qt.io/archive/qt/5.15/$env:QT_VER/single/qt-everywhere-opensource-src-$env:QT_VER.tar.xz"
          mkdir "$env:RUNNER_TEMP\qt-src"
          tar -xJf qt.tar.xz -C "$env:RUNNER_TEMP\qt-src" --strip-components=1
      - name: Configure / build / install
        shell: cmd
        run: |
          set PREFIX=%RUNNER_TEMP%\Qt%QT_VER%\%QT_VER%\%SPEC%
          mkdir "%RUNNER_TEMP%\qt-src\build-windows"
          cd "%RUNNER_TEMP%\qt-src\build-windows"
          call ..\configure -prefix %PREFIX% -release -opensource -confirm-license ^
            -nomake examples -nomake tests -skip qtwebengine -no-sql-mysql ^
            -sql-sqlite -plugin-sql-odbc -openssl-runtime -platform win32-msvc
          nmake
          nmake install
      - name: Archive & upload
        shell: pwsh
        run: |
          cd "$env:RUNNER_TEMP"
          tar -czf "qt-$env:QT_VER-windows-msvc2019_64.tar.gz" "Qt$env:QT_VER"
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: "qt-${{ inputs.qt_ver }}"
          release_name: "Qt ${{ inputs.qt_ver }}"
          file: ${{ runner.temp }}/qt-${{ inputs.qt_ver }}-windows-msvc2019_64.tar.gz
          asset_name: qt-${{ inputs.qt_ver }}-windows-msvc2019_64.tar.gz
          overwrite: true
          prerelease: ${{ inputs.prerelease }}
